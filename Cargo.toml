[workspace]
members = ["macros"]

[workspace.package]
description = "Use derive to create HTTP requests"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://gitlab.opencode.de/opentalk/libs/http-request-derive"


[package]
description.workspace = true
edition.workspace = true
license.workspace = true
name = "http-request-derive"
publish.workspace = true
repository.workspace = true
version = "0.1.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.82"
bytes = "1"
http = "1"
http-request-derive-macros = { version = "0.1.1", path = "macros" }
reqwest = { version = "0.12.7", optional = true, default-features = false }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
serde_url_params = { version = "0.2", optional = true }
snafu = "0.8"
url = "2"

[dev-dependencies]
mockito = "1.5"
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[features]
default = ["serde"]
reqwest = ["dep:reqwest"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_url_params"]
