[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
description = "Use derive to create HTTP requests"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://gitlab.opencode.de/opentalk/libs/http-request-derive"

[workspace.dependencies]
async-trait = "0.1.82"
bytes = "1"
darling = "0.20.8"
http = "1"
http-request-derive = { version = "0.0.0-dev", path = "crates/http-request-derive" }
http-request-derive-macros = { version = "0.0.0-dev", path = "crates/http-request-derive-macros" }
pretty_assertions = "1"
proc-macro2 = "1.0.81"
quote = "1.0.36"
serde = "1"
serde_json = "1"
serde_url_params = "0.2"
snafu = "0.8"
strum = "0.27.0"
syn = "2.0.60"
tokio = "1.0"
url = "2"
