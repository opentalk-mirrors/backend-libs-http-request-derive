workspace = { members = ["macros"] }

[package]
name = "http-request-derive"
version = "0.1.0"
edition = "2021"
publish = true
description = "Use derive to create HTTP requests"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/silwol/http-request-derive"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1"
http = "0.2"
http-request-derive-macros = { version = "0.1", path = "macros" }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
serde_url_params = { version = "0.2", optional = true }
snafu = "0.8"
url = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
pretty_assertions = "1"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_url_params"]
