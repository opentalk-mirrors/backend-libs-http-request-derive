[package]
description = "Use derive to create HTTP requests - reqwest client"
edition.workspace = true
license.workspace = true
name = "http-request-derive-client-reqwest"
publish.workspace = true
repository.workspace = true
version = "0.3.0"

[dependencies]
async-trait.workspace = true
http.workspace = true
http-request-derive.workspace = true
http-request-derive-client.workspace = true
reqwest.workspace = true
snafu.workspace = true
url.workspace = true

[dev-dependencies]
httptest.workspace = true
pretty_assertions = { workspace = true, features = [
  # This enables the assert_matches! macro which might change in the future
  # due to std::assert_matches! not being stable yet. If that is the case,
  # it should be easy to adapt to these changes.
  "unstable",
] }
pretty_env_logger.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
