[package]
description.workspace = true
edition.workspace = true
license.workspace = true
name = "http-request-derive"
publish.workspace = true
repository.workspace = true
version = "0.0.0-dev"

[dependencies]
async-trait = "0.1.82"
bytes = "1"
http = "1"
http-request-derive-macros.workspace = true
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
serde_url_params = { version = "0.2", optional = true }
snafu = "0.8"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_url_params"]
