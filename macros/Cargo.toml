[package]
name = "http-request-derive-macros"
version = "0.1.0"
edition = "2021"
publish = true
description = "Use derive to create HTTP requests"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/silwol/http-request-derive"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
darling = "0.20.5"
proc-macro2 = "1.0.78"
quote = "1.0.35"
strum = { version = "0.26.1", features = ["derive"] }
syn = "2.0.48"
